<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

  <h1>My To-Do List 📝</h1>

  <p>Add something you need to do.</p>

  <form id="todo-form">

    <input
      id="task-input"
      type="text"
      placeholder="Enter a task"
    >

    <button type="submit">
      Add Task
    </button>

  </form>

  <ul id="task-list"></ul>

</div>

  <script src="script.js"></script>

</body>
</html>
